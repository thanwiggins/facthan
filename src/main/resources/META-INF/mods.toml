modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="facthan"
version="${mod_version}"
displayName="Facthan"
authors="ThanWiggins"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional - Than's Worldborder (https://github.com/thanwiggins/worldborder). When present, the
# playable-world bound used by the capital search is read from it instead of Facthan's own
# fallbackWorldBorderRadius default (see WorldBorderCompat).
[[dependencies.${mod_id}]]
    modId="worldborder"
    mandatory=false
    versionRange=""
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="facthan.mixins.json"